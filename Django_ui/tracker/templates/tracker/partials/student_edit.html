<div id="student-card" class="card shadow mt-3">

    <div class="card-body">

        <h5 class="card-title">
            Edit Student
        </h5>


        <form
            hx-post="{% url 'update-student' student.student_id %}"
            hx-target="#student-card"
            hx-swap="outerHTML">

            {% csrf_token %}


            <div class="mb-3">
                <label class="form-label">
                    First Name
                </label>

                <input
                    class="form-control"
                    type="text"
                    name="first_name"
                    value="{{ student.first_name }}">
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Last Name
                </label>

                <input
                    class="form-control"
                    type="text"
                    name="last_name"
                    value="{{ student.last_name }}">
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Email
                </label>

                <input
                    class="form-control"
                    type="email"
                    name="email"
                    value="{{ student.email }}">
            </div>


            <button class="btn btn-success">
                Save
            </button>


            <button
                type="button"
                class="btn btn-secondary"
                hx-get="{% url 'student-detail' student.student_id %}"
                hx-target="#student-card"
                hx-swap="outerHTML">

                Cancel

            </button>


        </form>

    </div>

</div>
