<div id="student-card" class="card shadow mt-3">
    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center">

            <h5 class="card-title mb-0">
                Student Details
            </h5>

            <button
                class="btn btn-sm btn-outline-secondary"
                hx-get="{% url 'clear-student-detail' %}"
                hx-target="#student-card"
                hx-swap="outerHTML"
            >
                ✕
            </button>

        </div>


        <p class="mt-3">
           
        </p>
        <p>
            <strong>Name:</strong>
            {{student.first_name}}
            {{student.last_name}}
        </p>
        <p>
            <strong>Email:</strong>
            {{student.email}}
        </p>

    </div>
</div>
